[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-swarm-os"
version = "12.4.0"
description = "NEXUS Multi-Agent Orchestrator - Collaborative Intelligence Platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Yann Abadie" },
]
keywords = ["multi-agent", "orchestrator", "swarm", "llm", "collaborative-intelligence"]

dependencies = [
    # Core (lightweight, ~15MB)
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "email-validator>=2.0.0",  # Required by pydantic EmailStr
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "tiktoken>=0.5.2",
    # RAG - Sparse Retrieval (lightweight, ~5MB)
    "bm25s>=0.2.0",
    "PyStemmer>=2.2.0",
]

[project.optional-dependencies]
dense = [
    # RAG - Dense Retrieval (heavy: torch, onnxruntime)
    "lancedb>=0.4.0",
    "sentence-transformers>=3.2.0",
    "onnxruntime>=1.19.0",
]
ingest = [
    # Document ingestion (heavy: docling + deps)
    "docling>=2.15.0",
]
db = [
    # Data layer + event bus
    "sqlmodel>=0.0.14",
    "sqlalchemy>=2.0",
    "redis>=5.0.0",
]
api = [
    # CEREBRO REST API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "argon2-cffi>=23.1.0",
    "sqlmodel>=0.0.14",
    "sqlalchemy>=2.0",
    "redis>=5.0.0",
]
sdk = [
    # LLM provider SDKs
    "anthropic>=0.70.0",
    "google-genai>=1.0.0",
    "openai>=1.68.0",
]
mcp = [
    # MCP server protocol
    "mcp>=1.0.0",
]
otel = [
    # OpenTelemetry observability
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-anthropic>=0.1.0",
    "opentelemetry-instrumentation-google-genai>=0.1b0",
]
rust = [
    "maturin>=1.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]
all = [
    "nexus-swarm-os[dense,ingest,db,api,sdk,mcp,otel,dev]",
]

[project.scripts]
nexus = "nexus7:main"
nexus-research = "nexus_research:main"
nexus-mcp = "core.interface_pkg.mcp.server:main"

# =============================================================================
# Build Configuration
# =============================================================================

[tool.hatch.build.targets.wheel]
packages = ["core", "nexus7.py", "nexus_research.py"]

# =============================================================================
# Tool Configuration
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in argument defaults
    "SIM108",  # use ternary operator
    "UP042",   # str+Enum → StrEnum migration deferred (needs full test pass)
]

[tool.ruff.lint.isort]
known-first-party = ["core"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing adoption

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
timeout = 30
# Limit pytest workers to prevent OOM on large test suites
addopts = "--maxfail=10 --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
    "rust: marks tests requiring compiled Rust extension",
    "memory_heavy: marks tests that load large models or datasets",
]

[tool.coverage.run]
source = ["core"]
omit = [
    "tests/*",
    "core/drivers/legacy/*",
    "scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.maturin]
# Rust native extension configuration
module-name = "nexus_core"
manifest-path = "rust/nexus_core/Cargo.toml"
python-source = "."
features = []
# Optional: compile with --release for performance
profile = "release"

[tool.nexus]
codename = "COGNITIVE BOOST"
canonical_branch = "NX-CG"
